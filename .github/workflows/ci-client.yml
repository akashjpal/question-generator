name: CI - Client (Angular)

on:
  push:
    paths:
      - 'ai-metimeter-client/**'
      - '.github/workflows/ci-client.yml'
  pull_request:
    paths:
      - 'ai-metimeter-client/**'
      - '.github/workflows/ci-client.yml'

concurrency:
  group: ci-client-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-metimeter-client

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai-metimeter-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (SSR)
        run: npm run build

      - name: Unit tests
        run: npm run test
