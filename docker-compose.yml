# ==============================================================
# Question Generator — Docker Compose
# ==============================================================
# Usage:
#   1. Copy .env.example to .env and fill in your secrets
#   2. docker compose up --build
# ==============================================================

services:
  # ── Frontend (nginx removed) ─────────────────────────────────
  # nginx removed; frontend now serves SSR directly and is exposed to host

  # ── Angular Frontend (SSR) ──────────────────────────────────
  frontend:
    build: ./ai-metimeter-client
    ports:
      - "4200:4000"
    environment:
      - PORT=4000
      - API_URL=http://question-generator-api:3000
      - REPORTS_API_URL=http://reports-api:5082
      - ATTEMPT_API_URL=http://attempt-api:5136
      - AGENT_API_URL=http://ai-agent-chatbot:8010
    depends_on:
      - question-generator-api
      - attempt-api
      - reports-api
      - ai-agent-chatbot
    restart: unless-stopped

  # ── Question Generator Node/Bun API ─────────────────────────
  question-generator-api:
    build: ./question-generator-api-ts
    image: localhost:4566/question-generator/api:latest
    environment:
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_BUCKET_ID=${SUPABASE_BUCKET_ID}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://ministack:4566}
      - AWS_BUCKET_ALL=${AWS_BUCKET_ALL:-all-files}
      - AWS_BUCKET_CORRECT=${AWS_BUCKET_CORRECT:-correct-files}
      - AWS_BUCKET_INFECTED=${AWS_BUCKET_INFECTED:-infected-files}
      - AWS_SQS_PUBLISH_QUEUE_URL=${AWS_SQS_PUBLISH_QUEUE_URL:-http://ministack:4566/000000000000/question-generator}
      - AWS_SQS_DEAD_LETTER_QUEUE_URL=${AWS_SQS_DEAD_LETTER_QUEUE_URL:-http://ministack:4566/000000000000/question-generator-dlq}
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_started
      ministack:
        condition: service_healthy
    restart: unless-stopped

  # ── Question Worker (async LangGraph SQS consumer, no HTTP surface) ──
  # Replaces the old question-generator-worker/fastapi-worker service — see
  # question_worker_implementation_plan.md. That directory is left on disk,
  # untouched, in case of rollback; it's simply no longer built/run here.
  fastapi-worker:
    build: ./question-worker
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - LLM_MODEL=${OPENROUTER_MODEL:-moonshotai/kimi-k2}
      - JUDGE_MODEL=${OPENROUTER_MODEL:-moonshotai/kimi-k2}
      - EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://ministack:4566}
      - AWS_BUCKET_CORRECT=${AWS_BUCKET_CORRECT:-correct-files}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-http://ministack:4566/000000000000/question-generator}
      - SQS_DLQ_URL=${SQS_DLQ_URL:-http://ministack:4566/000000000000/question-generator-dlq}
      - SQS_MAX_MESSAGES=${SQS_MAX_MESSAGES:-5}
      - SQS_WAIT_TIME=${SQS_WAIT_TIME:-20}
      - SQS_VISIBILITY_TIMEOUT=${SQS_VISIBILITY_TIMEOUT:-120}
      - SQS_MAX_RECEIVE_COUNT=${SQS_MAX_RECEIVE_COUNT:-3}
      - VISIBILITY_HEARTBEAT_INTERVAL=${VISIBILITY_HEARTBEAT_INTERVAL:-60}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-3}
      - MAX_REGENERATION_ROUNDS=${MAX_REGENERATION_ROUNDS:-3}
      - DUPLICATE_SIMILARITY_THRESHOLD=${DUPLICATE_SIMILARITY_THRESHOLD:-0.90}
      - MIN_EXTRACTED_CHARS=${MIN_EXTRACTED_CHARS:-200}
      - MIN_CHARS_PER_QUESTION=${MIN_CHARS_PER_QUESTION:-400}
    depends_on:
      ministack:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  # ── Agentic Chatbot (FastAPI + LangGraph) ────────────────────
  ai-agent-chatbot:
    build: ./ai-agent-chatbot
    environment:
      - PORT=8010
      - SUPABASE_URL=${SUPABASE_URL}
      - QUESTION_GENERATOR_API_URL=http://question-generator-api:3000
      - AGENT_OPENROUTER_MODEL=${AGENT_OPENROUTER_MODEL:-moonshotai/kimi-k2}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:4200}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://ministack:4566}
    expose:
      - "8010"
    depends_on:
      question-generator-api:
        condition: service_started
      ministack:
        condition: service_healthy
    restart: unless-stopped

  # ── Attempt API (.NET) ───────────────────────────────────────
  attempt-api:
    build: ./AttemptAPI
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - CorsOrigins=${CORS_ORIGIN:-http://localhost:4200}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://ministack:4566}
    expose:
      - "5136"
    depends_on:
      ministack:
        condition: service_healthy
    restart: unless-stopped

  # ── Reports API (.NET) ──────────────────────────────────────
  reports-api:
    build: ./ReportsAPI
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - CorsOrigins=${CORS_ORIGIN:-http://localhost:4200}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://ministack:4566}
    expose:
      - "5082"
    depends_on:
      ministack:
        condition: service_healthy
    restart: unless-stopped

  # ── MiniStack (LocalStack-compatible AWS emulator) ───────────
  ministack:
    image: ministackorg/ministack
    environment:
      - S3_PERSIST=1
      - S3_DATA_DIR=/var/lib/ministack/s3
      - GATEWAY_PORT=4566
      # General persistence switch (covers SQS, among other services) — separate
      # from S3_PERSIST above. Lambda/IAM/notification config still has no
      # persistence mechanism in this build regardless (see RCA_Bug_MinistackDataLoss.md),
      # which is why ministack-init keeps re-provisioning those unconditionally.
      - PERSIST_STATE=1
      - STATE_DIR=/var/lib/ministack/state
    ports:
      - "4566:4566"
    volumes:
      - ministack-data:/var/lib/ministack
      - ./lambda:/lambda-src:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      # No curl/wget in this image (verified via `docker exec ... which curl` — neither
      # exists). busybox `nc -z` was also tried and is unreliable here — it reports the
      # gateway port closed even when a plain Python socket connect succeeds — so this
      # uses Python directly (present, since the image itself is Python-based).
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 4566), timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── MiniStack init (watches ministack, (re)provisions Lambda/IAM/buckets) ──
  # A persistent sidecar, not a one-shot job and not MiniStack's own
  # docker-entrypoint-initaws.d hook (that hook runs as a *blocking* part of
  # MiniStack's own ASGI startup, before the gateway can answer HTTP requests,
  # which deadlocks against itself — observed directly: LifespanTimeoutError).
  # It has to stay running: the Lambda function/IAM role/notification config
  # cannot survive a `ministack` container restart in this build (no
  # persistence mechanism for them at all), so this loop keeps watching and
  # re-provisions them every time it notices ministack came back up without
  # the Lambda function already present — not just once at stack startup.
  ministack-init:
    image: amazon/aws-cli:2.17.62
    entrypoint: ["/bin/sh", "/init/init-lambda.sh"]
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_CONNECTION_STRING=${DATABASE_CONNECTION_STRING}
    volumes:
      - ./ministack/init:/init:ro
      - ./lambda:/lambda-src:ro
    depends_on:
      ministack:
        condition: service_healthy
    restart: unless-stopped

  # ── StackPort (MiniStack resource browser UI) ────────────────
  stackport:
    image: davireis/stackport
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    ports:
      - "8080:8080"
    depends_on:
      - ministack
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD;
      else
        redis-server;
      fi"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── ClamAV ──────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    expose:
      - "3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  redis-data:
  clamav-data:
  ministack-data:
