# ==============================================================
# Question Generator — Docker Compose
# ==============================================================
# Usage:
#   1. Copy .env.example to .env and fill in your secrets
#   2. docker compose up --build
# ==============================================================

services:
  # ── Frontend (nginx removed) ─────────────────────────────────
  # nginx removed; frontend now serves SSR directly and is exposed to host

  # ── Angular Frontend (SSR) ──────────────────────────────────
  frontend:
    build: ./ai-metimeter-client
    ports:
      - "4200:4000"
    environment:
      - PORT=4000
      - API_URL=http://question-generator-api:3000
      - REPORTS_API_URL=http://reports-api:5082
      - ATTEMPT_API_URL=http://attempt-api:5136
      - AGENT_API_URL=http://ai-agent-chatbot:8010
    depends_on:
      - question-generator-api
      - attempt-api
      - reports-api
      - ai-agent-chatbot
    restart: unless-stopped

  # ── Question Generator Node/Bun API ─────────────────────────
  question-generator-api:
    build: ./question-generator-api-ts
    environment:
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_BUCKET_ID=${SUPABASE_BUCKET_ID}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
      - QUESTION_GENERATOR_WORKER_URL=http://fastapi-worker:8000
    expose:
      - "3000"
    depends_on:
      - redis
      - fastapi-worker
    restart: unless-stopped

  # ── FastAPI Question Generator Worker ────────────────────────
  fastapi-worker:
    build: ./question-generator-worker
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-moonshotai/kimi-k2}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
    expose:
      - "8000"
    restart: unless-stopped

  # ── Agentic Chatbot (FastAPI + LangGraph) ────────────────────
  ai-agent-chatbot:
    build: ./ai-agent-chatbot
    environment:
      - PORT=8010
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - QUESTION_GENERATOR_API_URL=http://question-generator-api:3000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AGENT_OPENROUTER_MODEL=${AGENT_OPENROUTER_MODEL:-moonshotai/kimi-k2}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:4200}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
    expose:
      - "8010"
    depends_on:
      - question-generator-api
    restart: unless-stopped

  # ── File Scanner Worker ──────────────────────────────────────
  file-scanner-worker:
    build: ./file-scanner-worker
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_BUCKET_ID=${SUPABASE_BUCKET_ID}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped

  # ── Attempt API (.NET) ───────────────────────────────────────
  attempt-api:
    build: ./AttemptAPI
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DATABASE_CONNECTION_STRING}
      - CorsOrigins=${CORS_ORIGIN:-http://localhost:4200}
    expose:
      - "5136"
    restart: unless-stopped

  # ── Reports API (.NET) ──────────────────────────────────────
  reports-api:
    build: ./ReportsAPI
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DATABASE_CONNECTION_STRING}
      - CorsOrigins=${CORS_ORIGIN:-http://localhost:4200}
    expose:
      - "5082"
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD;
      else
        redis-server;
      fi"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── ClamAV ──────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    expose:
      - "3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  redis-data:
  clamav-data:
